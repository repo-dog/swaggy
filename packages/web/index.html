<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" type="image/svg+xml" href="/favicon.svg" /><title>Swaggy</title></head>
  <body>
    <script>
      // Apply the persisted theme before paint to avoid a flash of the wrong mode.
      try {
        var t = JSON.parse(localStorage.getItem("swaggy.store") || "{}");
        if (t && t.state && t.state.theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
