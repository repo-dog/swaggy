name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! For **security vulnerabilities, do not use this form** —
        see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs. actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag, Docker image tag, or git commit.
      placeholder: "v0.1.0 / docker repo-dog/swaggy:0.1.0 / commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running Swaggy?
      options:
        - Docker image
        - From source (pnpm)
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: spec-version
    attributes:
      label: OpenAPI/Swagger version of the spec involved
      options:
        - Swagger 2.0
        - OpenAPI 3.0.x
        - OpenAPI 3.1
        - Not spec-specific / unsure
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, and anything else relevant.
      placeholder: "Chrome 126 on macOS 15"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, or a minimal spec
      description: |
        Paste any console/server errors or attach a small spec that reproduces it.
        **Redact** real hostnames, tokens, and private spec URLs.
    validations:
      required: false
