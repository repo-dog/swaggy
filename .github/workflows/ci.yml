name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # Integration e2e: real server + proxy + mock backend (no browser). The browser suite
      # (pnpm e2e:ui) needs a Playwright install and is run manually — see docs/TESTING.md.
      - name: Integration e2e
        run: pnpm e2e
